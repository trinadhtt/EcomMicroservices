spring:
  application: 
    name: order-service 
server:
  port: 8080
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    lease-renewal-interval-in-seconds: 5
    instance-id: ${spring.application.name}:${server.port}
logging:
  level:
    com.ecom.order_service.client: DEBUG 
    com.netflix.discovery: DEBUG
resilience4j:
  ratelimiter:
    instances:
      inventoryService:
        limit-for-period: 2  # 2 request for 10 sec
        limit-refresh-period: 10s # 10 sec for refresh limits
        timeout-duration: 0s # duration to throw error
      