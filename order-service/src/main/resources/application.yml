spring:
  application: 
    name: order-service 
server:
  port: 8080
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    lease-renewal-interval-in-seconds: 5
    instance-id: ${spring.application.name}:${server.port}
logging:
  level:
    com.ecom.order_service.client: DEBUG 
    com.netflix.discovery: DEBUG
resilience4j:
  ratelimiter:
    instances:
      inventoryService:
        limit-for-period: 2  # 2 request for 10 sec
        limit-refresh-period: 10s # 10 sec for refresh limits
        timeout-duration: 0s # duration to throw error
  circuitbreaker:
    instances:
      inventoryServiceCircuitBreaker:

       #Sliding Window Configuration
        sliding-window-type: COUNT_BASED
        sliding-window-size: 6
        minimum-number-of-calls: 1
       # failure threshold
        failure-rate-threshold: 50
       # Open State Configuration
        wait-duration-in-open-state: 10s
       # Half Open Configuration
        permitted-number-of-calls-in-half-open-state: 3
        max-wait-duration-in-half-open-state: 5s
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.lang.RuntimeException
          - java.io.IOException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - java.lang.IllegalArgumentException
  timelimiter:
    instances:
      inventoryServiceTimeLimiter:
        timeout-duration: 2s
        cancel-running-future: true
  bulkhead:
    instances:
      inventoryServiceBulkHead:
        max-concurrent-calls: 2
        max-wait-duration: 10s
  thread-pool-bulkhead:
    instances:
      inventoryServiceThreadpoolBulkHead:
        max-thread-pool-size: 2
        core-thread-pool-size: 1
        queue-capacity: 0